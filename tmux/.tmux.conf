# =============================================================================
# Minimal tmux configuration
# Extracted from gpakosz/.tmux with Justin's customizations
# =============================================================================

# -- General ------------------------------------------------------------------

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"  # Enable true color support

setw -g xterm-keys on
set -s escape-time 10                       # Faster command sequences
set -sg repeat-time 600                     # Increase repeat timeout
set -s focus-events on

set -g prefix2 C-a                          # GNU-Screen compatible prefix
bind C-a send-prefix -2

set -g history-limit 10000                  # Boost history

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# -- Display ------------------------------------------------------------------

set -g base-index 1                         # Start windows numbering at 1
setw -g pane-base-index 1                   # Make pane numbering consistent

setw -g automatic-rename on                 # Rename window to reflect current program
set -g renumber-windows on                  # Renumber windows when one is closed

set -g set-titles on                        # Set terminal title

set -g display-panes-time 800               # Longer pane indicators display time
set -g display-time 1000                    # Longer status messages display time

set -g status-interval 10                   # Redraw status line every 10 seconds

# Activity
set -g monitor-activity on
set -g visual-activity off

# -- Navigation ---------------------------------------------------------------

# Create session
bind C-c new-session

# Find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# Session navigation
bind BTab switch-client -l                  # Move to last session

# Split current window
bind - split-window -v -c "#{pane_current_path}"   # Horizontal split
bind _ split-window -h -c "#{pane_current_path}"   # Vertical split

# Pane navigation (vim-style)
bind -r h select-pane -L                    # Move left
bind -r j select-pane -D                    # Move down
bind -r k select-pane -U                    # Move up
bind -r l select-pane -R                    # Move right
bind > swap-pane -D                         # Swap current pane with next
bind < swap-pane -U                         # Swap current pane with previous

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation
unbind n
unbind p
bind -r C-h previous-window                 # Select previous window
bind -r C-l next-window                     # Select next window
bind Tab last-window                        # Move to last active window

# Toggle mouse
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# -- Copy Mode (vi-style) -----------------------------------------------------

setw -g mode-keys vi

bind Enter copy-mode                        # Enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# -- Clipboard Integration ----------------------------------------------------

# Justin's WSL clipboard bindings (win32yank)
bind-key -n C-v run "win32yank -o | tmux load-buffer - ; tmux paste-buffer"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "win32yank -i --crlf"

# Cross-platform clipboard support
# X11 (xsel)
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xsel -i -b"'
# X11 (xclip fallback)
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
# Wayland
if -b 'command -v wl-copy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | wl-copy"'
# macOS
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | pbcopy"'
# Windows (clip.exe)
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | clip.exe"'

# -- Buffers ------------------------------------------------------------------

bind b list-buffers                         # List paste buffers
bind p paste-buffer -p                      # Paste from top buffer
bind P choose-buffer                        # Choose which buffer to paste

# -- Status Bar (minimal) -----------------------------------------------------

set -g status-position bottom
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[fg=#89b4fa,bold][#S] '
set -g status-right '#[fg=#a6adc8]%Y-%m-%d %H:%M '
set -g status-left-length 30
set -g status-right-length 50

# Window status
setw -g window-status-current-style 'fg=#1e1e2e bg=#89b4fa bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'fg=#cdd6f4 bg=#313244'
setw -g window-status-format ' #I:#W#F '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Message style
set -g message-style 'fg=#1e1e2e bg=#f9e2af bold'
